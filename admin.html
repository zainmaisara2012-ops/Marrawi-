<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - دراجات كركر</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>لوحة التحكم</h1>
    <div>
      <a href="index.html" style="margin-left:10px;">الموقع</a>
      <button onclick="logout()" class="logout-btn" style="padding:8px 16px;border-radius:20px;border:none;color:white;cursor:pointer;">خروج</button>
    </div>
  </div>

  <div class="admin-container">

    <!-- نموذج تسجيل الدخول -->
    <div id="loginSection" class="login-box">
      <h2 style="margin-bottom:20px;text-align:center;">تسجيل دخول الأدمن</h2>
      <input type="email" id="email" placeholder="الإيميل">
      <input type="password" id="password" placeholder="كلمة السر">
      <button onclick="login()">دخول</button>
      <p id="loginError" style="color:red;margin-top:10px;text-align:center;"></p>
    </div>

    <!-- لوحة التحكم -->
    <div id="adminSection" style="display:none;">
      
      <div class="admin-form">
        <h2 style="margin-bottom:16px;">إضافة منتج جديد</h2>
        
        <input type="text" id="productName" placeholder="اسم المنتج *">
        <input type="text" id="productPrice" placeholder="السعر (اتركه فاضي إذا السعر عند الطلب)">
        
        <!-- اختيار صورة من الاستوديو -->
        <label style="display:block; margin-bottom:8px; font-weight:600;">صورة المنتج:</label>
        <input type="file" id="productImage" accept="image/*" style="margin-bottom:12px;">
        <img id="imagePreview" style="max-width:100%; max-height:180px; border-radius:10px; display:none; margin-bottom:12px;">
        
        <input type="text" id="productCategory" placeholder="الصنف (مثلاً: بطاريات، شواحن، إطارات...)">
        <textarea id="productDescription" rows="3" placeholder="وصف المنتج (اختياري)"></textarea>
        
        <button onclick="addProduct()">إضافة المنتج</button>
      </div>

      <h2 style="margin:24px 0 12px;">المنتجات الحالية</h2>
      <div id="adminProductsList">
        <!-- المنتجات رح تظهر هنا -->
      </div>
    </div>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
